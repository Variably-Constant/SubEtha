# Build the Python wheels, on demand and on a tag.
#
# Two kinds of wheel come out of this, for the reason the crate's
# `abi3` feature exists. One wheel serves every interpreter from 3.11
# upward, because it targets the stable ABI. A free-threaded
# interpreter has no stable ABI to target until 3.15, so each of those
# takes a wheel of its own, built without that feature.
#
# Nothing here publishes. The wheels are left as artifacts for a person
# to look at and upload.

name: python wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # A published wheel targets the baseline, never the machine that built
  # it. A build host whose cargo config says target-cpu=native produces
  # a wheel that dies with an illegal instruction on import anywhere
  # else, and the crate dispatches its wide kernels at run time anyway,
  # so the baseline costs nothing. Set here rather than left to the
  # runner, because the environment variable replaces a config file's
  # setting and a config file is what would otherwise decide this.
  RUSTFLAGS: "-C target-cpu=x86-64"

jobs:
  stable-abi:
    name: stable ABI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor the stable ABI is taken against. A wheel built
          # here runs on every later interpreter too.
          python-version: "3.11"

      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/subetha-py
          command: build
          args: --release --out dist

      - name: Check the wheel imports and its tests pass
        shell: bash
        working-directory: crates/subetha-py
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist subetha
          python -c "import subetha; print(subetha.transports, subetha.free_threaded)"
          python -m pytest tests -q

      # Whether help() has anything to say is a property of the built
      # module rather than of the source, and the source-side count has
      # been wrong in both directions: a parser gap called a documented
      # method bare, and a doc comment in a place PyO3 does not carry
      # would never reach __doc__ at all. Asked here, of the wheel.
      - name: Check every method has something for help()
        shell: bash
        working-directory: crates/subetha-py
        run: python tools/check_docs.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-abi3-${{ matrix.os }}
          path: crates/subetha-py/dist

  free-threaded:
    name: free-threaded ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # One wheel per free-threaded interpreter, because there is no
        # stable ABI covering them yet.
        python: ["3.14t"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Confirm this interpreter really has no lock
        shell: bash
        run: |
          python -c "import sysconfig, sys; \
            assert sysconfig.get_config_var('Py_GIL_DISABLED'), \
            'this job is meaningless on a build that has the lock'; \
            print(sys.version)"

      - name: Build without the stable ABI
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/subetha-py
          command: build
          args: --release --out dist --no-default-features

      - name: Check the lock stays off and the threading tests pass
        shell: bash
        working-directory: crates/subetha-py
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist subetha
          # The module declares it does not need the lock. If that
          # declaration were missing or wrong the interpreter would
          # switch the lock back on here, which is what this catches.
          python -c "import sys, subetha; \
            assert subetha.free_threaded, 'built against the wrong interpreter'; \
            assert not sys._is_gil_enabled(), 'importing switched the lock back on'"
          python -m pytest tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}-${{ matrix.os }}
          path: crates/subetha-py/dist

  source:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/subetha-py
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/subetha-py/dist
