# The macOS half of the PowerShell module.
#
# The module ships one native per platform under runtimes/<rid>/native/.
# This workflow builds the osx-arm64 dylib, runs the Pester suite against
# it, and uploads the module folder for a release to fold in. It runs on
# every push to main, on release tags, and on dispatch.

name: pwrs macos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  module:
    name: PowerShell module on macOS arm64
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # macos-latest is aarch64, where an x86 target-cpu is accepted with
      # a warning and miscompiles. apple-a14 is the oldest Apple Silicon
      # core, so a native built for it runs on every Mac that has one.
      RUSTFLAGS: "-C target-cpu=apple-a14"
    steps:
      - uses: actions/checkout@v4

      - name: What the host has
        shell: bash
        run: |
          uname -m
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          dotnet --version

      # The same version every other host builds with, or the manifests
      # differ and `cargo pwrs merge` refuses this folder.
      - name: Install the build tool
        run: cargo install cargo-pwrs --version 0.3.2 --locked --force

      - name: Build the module
        shell: bash
        run: cargo pwrs build --release --manifest-dir crates/subetha-pwrs

      # Runs the suite in one pwsh and prints each test as it finishes. A
      # suite still running after 600 s has its threads sampled and its
      # UDP sockets listed before it is stopped, and the file it stopped
      # in then runs again by itself.
      - name: Run the Pester suite under a watchdog
        shell: bash
        run: bash .github/scripts/pester-watchdog.sh "$PWD/target/pwrs/SubEtha" "$PWD/crates/subetha-pwrs/tests" 600

      - name: Run the Pester suite
        shell: bash
        run: cargo pwrs test --release --manifest-dir crates/subetha-pwrs

      # The whole module folder, so its manifest can be checked against
      # the other platforms' before the native is folded in. `cargo pwrs
      # merge` refuses manifests that differ.
      - uses: actions/upload-artifact@v4
        with:
          name: pwrs-module-osx-arm64
          path: target/pwrs/SubEtha
