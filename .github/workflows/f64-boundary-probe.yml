# Does an f64 survive the PyO3 boundary on this target?
#
# SubEtha's macOS arm64 wheel fails every test that carries an f64, in
# both build configurations, while Windows and Linux pass all of them.
# One of those failures cannot originate in SubEtha's own code:
# QosPolicy.max_latency reads a Duration back through as_secs_f64, which
# is secs as f64 + nanos as f64 / 1e9 and has no input producing NaN,
# yet Python sees NaN.
#
# This builds a crate that depends on nothing but PyO3 and holds no
# state, so a wrong answer implicates the toolchain rather than SubEtha.
# It touches no crate in this repository.
#
# The three legs are what make one run decisive. A failure on both arm64
# legs is AArch64 generally, with Darwin incidental; a failure on macOS
# alone is Darwin-specific. The x86_64 leg is the control, and it is
# expected to pass: the same probe already passes on an x86_64 Windows
# host, so a failure there would mean the probe, not the target.
#
# Temporary, and dispatch-only so it never runs on a push. It exists to
# answer one question and should be deleted once that question has an
# answer.

name: f64 boundary probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: arm64 Darwin
          - os: ubuntu-24.04-arm
            label: arm64 Linux
          - os: ubuntu-latest
            label: x86_64 Linux (control)
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the probe
        shell: bash
        run: |
          mkdir -p probe/src
          cat > probe/Cargo.toml <<'EOF'
          [package]
          name = "f64probe"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [lib]
          name = "f64probe"
          crate-type = ["cdylib"]

          [dependencies]
          pyo3 = { version = "0.27", features = ["extension-module"] }
          EOF
          cat > probe/pyproject.toml <<'EOF'
          [build-system]
          requires = ["maturin>=1.7,<2.0"]
          build-backend = "maturin"

          [project]
          name = "f64probe"
          requires-python = ">=3.11"
          description = "Whether an f64 survives the PyO3 boundary on this target"
          dynamic = ["version"]

          [tool.maturin]
          module-name = "f64probe"
          EOF
          cat > probe/src/lib.rs <<'EOF'
          use pyo3::prelude::*;

          #[pyfunction]
          fn constant() -> f64 { 0.5 }

          #[pyfunction]
          fn echo(x: f64) -> f64 { x }

          #[pyfunction]
          fn through_duration(seconds: f64) -> f64 {
              std::time::Duration::from_secs_f64(seconds).as_secs_f64()
          }

          #[pyfunction]
          fn constant_bits() -> u64 { 0.5f64.to_bits() }

          #[pyfunction]
          fn report() -> String {
              let mut out = String::new();
              let checks: [(&str, f64, f64); 4] = [
                  ("constant()", constant(), 0.5),
                  ("echo(0.5)", echo(0.5), 0.5),
                  ("echo(0.01)", echo(0.01), 0.01),
                  ("through_duration(0.5)", through_duration(0.5), 0.5),
              ];
              for (name, got, want) in checks {
                  out.push_str(&format!("{:<24} got {:<24} want {:<8} {}\n",
                      name, got, want, if got == want { "PASS" } else { "FAIL" }));
              }
              let bits = constant_bits();
              out.push_str(&format!("{:<24} got {:#018x} want {:#018x} {}\n",
                  "constant_bits()", bits, 0.5f64.to_bits(),
                  if bits == 0.5f64.to_bits() { "PASS" } else { "FAIL" }));
              out
          }

          #[pymodule]
          fn f64probe(m: &Bound<'_, PyModule>) -> PyResult<()> {
              m.add_function(wrap_pyfunction!(constant, m)?)?;
              m.add_function(wrap_pyfunction!(echo, m)?)?;
              m.add_function(wrap_pyfunction!(through_duration, m)?)?;
              m.add_function(wrap_pyfunction!(constant_bits, m)?)?;
              m.add_function(wrap_pyfunction!(report, m)?)?;
              Ok(())
          }
          EOF

      - name: Build it
        uses: PyO3/maturin-action@v1
        with:
          working-directory: probe
          command: build
          args: --release --out dist

      # The verdict is the point of the run, so it is printed rather
      # than left in an artifact, and a FAIL on any line fails the job:
      # a probe whose answer nobody reads is not a probe.
      - name: Ask it
        shell: bash
        working-directory: probe
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist f64probe
          python -c "import platform; print('machine:', platform.machine(), 'python:', platform.python_version())"
          python -c "import sys, f64probe; r = f64probe.report(); print(r); sys.exit(1 if 'FAIL' in r else 0)"
