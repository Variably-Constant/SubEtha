# cbindgen configuration for the SubEtha C ABI. The generated header is
# committed at include/subetha.h; tests/header.rs regenerates it and fails
# when the committed copy differs.

language = "C"
include_guard = "SUBETHA_H"
include_version = true
cpp_compat = true
usize_is_size_t = true
documentation = true
documentation_style = "doxy"
style = "both"
tab_width = 4
line_length = 100
header = """/*
 * SubEtha C ABI.
 *
 * Generated by cbindgen from crates/subetha-ffi. Do not edit by hand:
 * tests/header.rs regenerates this file and fails when it has drifted.
 *
 * Every function returns int32_t: SUBETHA_OK, or a code that
 * subetha_strerror() names. A failing call leaves its specifics in a
 * thread-local buffer that subetha_last_error_detail() copies out.
 */"""
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true

[defines]
"feature = test-hooks" = "SUBETHA_TEST_HOOKS"

[export]
# Every item that reaches the header is named in C style at its definition.
prefix = ""

[fn]
rename_args = "None"
sort_by = "None"

[struct]
rename_fields = "None"

[const]
allow_static_const = false
allow_constexpr = false

[parse]
parse_deps = false
