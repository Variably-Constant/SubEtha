[package]
name = "subetha-ffi-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The C test suite for subetha-ffi, compiled by the host's C compiler and run by cargo test on every gate host."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
subetha-ffi = { workspace = true, features = ["test-hooks"] }

[build-dependencies]
cc = "1"
